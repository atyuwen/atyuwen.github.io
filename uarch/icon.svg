<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2744"/>
      <stop offset="100%" style="stop-color:#0d1520"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151"/>
      <stop offset="100%" style="stop-color:#1f2937"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- CPU pins - top -->
  <g stroke="#22c55e" stroke-width="4" opacity="0.7">
    <line x1="170" y1="80" x2="170" y2="130"/>
    <line x1="210" y1="80" x2="210" y2="130"/>
    <line x1="256" y1="80" x2="256" y2="130"/>
    <line x1="302" y1="80" x2="302" y2="130"/>
    <line x1="342" y1="80" x2="342" y2="130"/>
  </g>
  <!-- CPU pins - bottom -->
  <g stroke="#22c55e" stroke-width="4" opacity="0.7">
    <line x1="170" y1="370" x2="170" y2="420"/>
    <line x1="210" y1="370" x2="210" y2="420"/>
    <line x1="256" y1="370" x2="256" y2="420"/>
    <line x1="302" y1="370" x2="302" y2="420"/>
    <line x1="342" y1="370" x2="342" y2="420"/>
  </g>
  <!-- CPU pins - left -->
  <g stroke="#22c55e" stroke-width="4" opacity="0.7">
    <line x1="80" y1="180" x2="130" y2="180"/>
    <line x1="80" y1="220" x2="130" y2="220"/>
    <line x1="80" y1="260" x2="130" y2="260"/>
    <line x1="80" y1="300" x2="130" y2="300"/>
    <line x1="80" y1="340" x2="130" y2="340"/>
  </g>
  <!-- CPU pins - right -->
  <g stroke="#22c55e" stroke-width="4" opacity="0.7">
    <line x1="382" y1="180" x2="432" y2="180"/>
    <line x1="382" y1="220" x2="432" y2="220"/>
    <line x1="382" y1="260" x2="432" y2="260"/>
    <line x1="382" y1="300" x2="432" y2="300"/>
    <line x1="382" y1="340" x2="432" y2="340"/>
  </g>
  <!-- Pin dots -->
  <g fill="#22c55e" opacity="0.9">
    <circle cx="170" cy="76" r="5"/><circle cx="210" cy="76" r="5"/><circle cx="256" cy="76" r="5"/><circle cx="302" cy="76" r="5"/><circle cx="342" cy="76" r="5"/>
    <circle cx="170" cy="424" r="5"/><circle cx="210" cy="424" r="5"/><circle cx="256" cy="424" r="5"/><circle cx="302" cy="424" r="5"/><circle cx="342" cy="424" r="5"/>
    <circle cx="76" cy="180" r="5"/><circle cx="76" cy="220" r="5"/><circle cx="76" cy="260" r="5"/><circle cx="76" cy="300" r="5"/><circle cx="76" cy="340" r="5"/>
    <circle cx="436" cy="180" r="5"/><circle cx="436" cy="220" r="5"/><circle cx="436" cy="260" r="5"/><circle cx="436" cy="300" r="5"/><circle cx="436" cy="340" r="5"/>
  </g>
  <!-- Chip body -->
  <rect x="130" y="130" width="252" height="240" rx="16" fill="url(#chip)" stroke="#4b5563" stroke-width="2"/>
  <!-- Die -->
  <rect x="165" y="165" width="182" height="170" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
  <!-- Pipeline stages inside die -->
  <rect x="178" y="178" width="156" height="28" rx="4" fill="#3b82f6" opacity="0.7"/>
  <text x="256" y="197" text-anchor="middle" fill="white" font-family="monospace" font-size="13" font-weight="600">FETCH</text>
  <rect x="178" y="214" width="156" height="28" rx="4" fill="#8b5cf6" opacity="0.7"/>
  <text x="256" y="233" text-anchor="middle" fill="white" font-family="monospace" font-size="13" font-weight="600">DECODE</text>
  <rect x="178" y="250" width="156" height="28" rx="4" fill="#f59e0b" opacity="0.7"/>
  <text x="256" y="269" text-anchor="middle" fill="white" font-family="monospace" font-size="13" font-weight="600">EXECUTE</text>
  <rect x="178" y="286" width="156" height="28" rx="4" fill="#22c55e" opacity="0.7"/>
  <text x="256" y="305" text-anchor="middle" fill="white" font-family="monospace" font-size="13" font-weight="600">RETIRE</text>
  <!-- Label -->
  <text x="256" y="470" text-anchor="middle" fill="white" font-family="sans-serif" font-size="40" font-weight="700" letter-spacing="3">CPU</text>
</svg>
