<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f1f33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Attention lines (cross connections) -->
  <g stroke="#60a5fa" stroke-width="2" opacity="0.3">
    <line x1="140" y1="130" x2="280" y2="226"/>
    <line x1="140" y1="130" x2="340" y2="226"/>
    <line x1="140" y1="130" x2="400" y2="226"/>
    <line x1="200" y1="130" x2="280" y2="226"/>
    <line x1="200" y1="130" x2="340" y2="226"/>
    <line x1="200" y1="130" x2="400" y2="226"/>
    <line x1="260" y1="130" x2="280" y2="226"/>
    <line x1="260" y1="130" x2="340" y2="226"/>
    <line x1="260" y1="130" x2="400" y2="226"/>
    <line x1="320" y1="130" x2="280" y2="226"/>
    <line x1="320" y1="130" x2="340" y2="226"/>
    <line x1="320" y1="130" x2="400" y2="226"/>
    <line x1="380" y1="130" x2="280" y2="226"/>
    <line x1="380" y1="130" x2="340" y2="226"/>
    <line x1="380" y1="130" x2="400" y2="226"/>
  </g>
  <!-- Stronger attention highlights -->
  <g stroke="#60a5fa" stroke-width="3" opacity="0.6">
    <line x1="140" y1="130" x2="280" y2="226"/>
    <line x1="260" y1="130" x2="340" y2="226"/>
    <line x1="380" y1="130" x2="400" y2="226"/>
    <line x1="200" y1="130" x2="340" y2="226"/>
  </g>
  <!-- Input tokens (top row) -->
  <g fill="url(#accent)">
    <circle cx="140" cy="130" r="16"/>
    <circle cx="200" cy="130" r="16"/>
    <circle cx="260" cy="130" r="16"/>
    <circle cx="320" cy="130" r="16"/>
    <circle cx="380" cy="130" r="16"/>
  </g>
  <!-- Output tokens (middle row) -->
  <g fill="#f59e0b">
    <circle cx="280" cy="226" r="16"/>
    <circle cx="340" cy="226" r="16"/>
    <circle cx="400" cy="226" r="16"/>
  </g>
  <!-- FFN block -->
  <rect x="120" y="276" rx="12" width="280" height="50" fill="#22c55e" opacity="0.8"/>
  <text x="260" y="307" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20" font-weight="600">Feed Forward</text>
  <!-- Output layer -->
  <g fill="#a78bfa">
    <circle cx="170" cy="390" r="14"/>
    <circle cx="230" cy="390" r="14"/>
    <circle cx="290" cy="390" r="14"/>
    <circle cx="350" cy="390" r="14"/>
  </g>
  <!-- Connections FFN to output -->
  <g stroke="#a78bfa" stroke-width="2" opacity="0.4">
    <line x1="180" y1="326" x2="170" y2="376"/>
    <line x1="260" y1="326" x2="230" y2="376"/>
    <line x1="260" y1="326" x2="290" y2="376"/>
    <line x1="340" y1="326" x2="350" y2="376"/>
  </g>
  <!-- Label -->
  <text x="256" y="460" text-anchor="middle" fill="white" font-family="sans-serif" font-size="36" font-weight="700" letter-spacing="2">TRANSFORMER</text>
</svg>
